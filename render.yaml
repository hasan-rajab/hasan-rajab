services:
  - type: web
    name: hasan-ai-consulting
    runtime: static
    buildCommand: echo "Static portfolio"
    staticPublishPath: ./portfolio
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
