name: run-network-traffic-project-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-network-traffic-project-once.yml"

permissions:
  contents: write

env:
  PYTHONHASHSEED: "20261002"

jobs:
  run-project:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: network-traffic-forecasting
          fetch-depth: 0

      - name: Reassemble and verify project archive
        shell: bash
        run: |
          cat .bootstrap/chunks/part00.b64 .bootstrap/chunks/part01.b64 .bootstrap/chunks/part02.b64 > /tmp/network-project.tar.gz.b64
          echo "0e649c246be452343a214bd0d0b4d513b1510f79dd3ecfa428c7c6ac357a7f52  /tmp/network-project.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/network-project.tar.gz.b64 > /tmp/network-project.tar.gz
          echo "69df4de07a729f141772d0e82103985613550b47ff55bbea7c16ccdabe353ab4  /tmp/network-project.tar.gz" | sha256sum -c -
          git rm -rf .
          tar -xzf /tmp/network-project.tar.gz
          rm -rf .pytest_cache **/__pycache__ || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Run complete reproducible pipeline
        run: make all

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-traffic-results
          path: |
            results/
            figures/
            data/processed/
            README.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit project and measured results to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build telecom traffic forecasting project with measured results [skip ci]"
          git push origin HEAD:network-traffic-forecasting
