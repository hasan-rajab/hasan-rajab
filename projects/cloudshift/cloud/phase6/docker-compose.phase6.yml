services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.cloud
    container_name: cloudshift-p6-frontend
    environment:
      API_URL: http://localhost:8080
    ports:
      - "3000:8080"
    depends_on:
      - api

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: cloudshift-p6-api
    environment:
      PORT: 8080
      APP_NAME: CloudShift
      APP_ENV: phase6
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cloudshift
      DB_USER: cloudshift
      DB_PASSWORD: cloudshift_dev
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      DB_POOL_TIMEOUT: 10
      DB_TEST_DELAY_SECONDS: 0

      SHIPPING_BASE_URL: http://shipping:9000
      SHIPPING_TIMEOUT_SECONDS: 2
      SHIPPING_API_TOKEN: cloudshift-demo-token

      FIRESTORE_ENABLED: "true"
      FIRESTORE_PROJECT_ID: cloudshift-local
      FIRESTORE_DATABASE: "(default)"
      FIRESTORE_EMULATOR_HOST: host.docker.internal:8085
      AUDIT_COLLECTION: audit_events

      SCENARIO_BAD_HTTP_STATUS: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      shipping:
        condition: service_started

  shipping:
    build:
      context: ../../mock_shipping
    container_name: cloudshift-p6-shipping
    environment:
      SHIPPING_DELAY_SECONDS: 0.15
      SHIPPING_REQUIRED_TOKEN: cloudshift-demo-token
    ports:
      - "9000:9000"

  db:
    image: postgres:16-alpine
    container_name: cloudshift-p6-db
    environment:
      POSTGRES_DB: cloudshift
      POSTGRES_USER: cloudshift
      POSTGRES_PASSWORD: cloudshift_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudshift -d cloudshift"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - cloudshift_phase6_pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: cloudshift-p6-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./cloud/phase6/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cloudshift_phase6_prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    container_name: cloudshift-p6-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cloudshift
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./cloud/phase6/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./cloud/phase6/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cloudshift_phase6_grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  cloudshift_phase6_pgdata:
  cloudshift_phase6_prometheus:
  cloudshift_phase6_grafana:
